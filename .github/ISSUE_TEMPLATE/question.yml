name: 'Questions / Help'
description: If you have questions, please check the Discussions section
title: '[Please read the message below]'
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        ## Questions and Help

        This issue tracker is reserved for bug reports and feature requests.

        For anything else, such as questions or requests for help, see the Discussions section:

        - [Discussions](https://github.com/larrykramer/test-framework/discussions)
  - type: checkboxes
    id: no-post
    attributes:
      label: |
        Please do not submit this issue.
      description: |
        > [!IMPORTANT]
        > This issue will be closed.
      options:
        - label: I understand
          required: true
