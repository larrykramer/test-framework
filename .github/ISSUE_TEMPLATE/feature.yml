name: Feature Request
description: Submit a proposal for a new feature
title: '[Feature]: '
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        ### Thank you for taking the time to suggest a new feature!

        **Before filling out this report**, please check [existing feature requests](https://github.com/larrykramer/test-framework/issues?q=is%3Aissue+label%3Afeature) and see if your feature has already been proposed.
  - type: textarea
    id: description
    attributes:
      label: 'Feature Request'
      description: A clear and concise description of what the feature is.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: Describe how this feature would be used.
    validations:
      required: false
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: |
        Outline your motivation for the proposal. How will it make the Test Framework better?
    validations:
      required: true
