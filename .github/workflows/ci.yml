name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      # These are the defaults.
      # See: https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request
      - opened
      - synchronize
      - reopened
    branches:
      - main

permissions:
  contents: read # to fetch code

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci-unit-tests:
    name: Unit Tests - CI
    if: >-
      github.event_name != 'push' ||
      !contains(join(github.event.commits.*.message, ' '), '[skip ci]')
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - name: Run CI unit tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  checkstyle:
    name: Checkstyle
    permissions:
      # Job-level permissions override the workflow-level permissions, so we
      # must repeat contents: read here for actions/checkout.
      contents: read # to fetch code
      checks: write # to publish checkstyle annotations
    needs: ci-unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'oracle'
          java-version: '21'
          cache: 'maven'
      - id: checkstyle
        name: Run Checkstyle
        run: mvn -B -fae checkstyle:check
      - if: >-
          !cancelled() &&
          (steps.checkstyle.outcome == 'success' || steps.checkstyle.outcome == 'failure') &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        name: Publish Checkstyle results
        run: python3 ./.github/scripts/upload_checkstyle.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECKS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKSTYLE_OUTCOME: ${{ steps.checkstyle.outcome }}

  unit-tests:
    name: Unit Tests - JDK ${{ matrix.java }} [${{ matrix.os.name }}]
    needs: checkstyle
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'oracle'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Run unit tests
        run: mvn -B -pl test-framework-core -am clean test -Dcheckstyle.skip=true
      - if: failure()
        name: Upload Surefire Reports on Failure
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ matrix.os.runner }}-jdk${{ matrix.java }}
          path: 'test-framework-core/target/surefire-reports/*'
          if-no-files-found: ignore
    strategy:
      matrix:
        java:
          - '21'
          - '25'
        os:
          - runner: ubuntu-latest
            name: 'Linux'
          - runner: windows-latest
            name: 'Windows'
          - runner: macos-26
            name: 'macOS'
      fail-fast: false

  ci-status:
    name: Workflow Status
    needs:
      - ci-unit-tests
      - checkstyle
      - unit-tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    steps:
        #language=bash
      - run: |
          # If CI was intentionally skipped on push via '[skip ci]'.
          # This must check the first job guarded by that condition. That condition
          # should be defined on the first job in the CI workflow.
          if [[ "${{ needs.ci-unit-tests.result }}" == "skipped" ]]; then
            echo "CI skipped"
            exit 0
          fi

          FAILING_JOBS=$(echo "$NEEDS_JSON" | jq -r '
              to_entries |
              .[] |
              select(.value.result != "success" and .value.result != "skipped") |
              "\(.key): \(.value.result)"
            ')
          if [ -n "$FAILING_JOBS" ]; then
            echo "CI failed"
            echo "The following jobs did not succeed:"
            echo "$FAILING_JOBS"
            exit 1
          fi

          echo "CI passed"
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
