name: CI

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    types:
      # These are the defaults.
      # See: https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request
      - opened
      - synchronize
      - reopened
    branches:
      - main

jobs:
  unit-tests:
    name: Unit Tests - JDK ${{ matrix.java }} [${{ matrix.os.name }}]
    runs-on: ${{ matrix.os.runner }}
    if: >-
      github.event_name != 'push' ||
      !contains(join(github.event.commits.*.message, ' '), '[skip ci]')
    strategy:
      fail-fast: false
      matrix:
        java:
          - '21'
          - '25'
        os:
          - runner: ubuntu-latest
            name: 'Ubuntu'
          - runner: windows-latest
            name: 'Windows'
          - runner: macos-26
            name: 'macOS 26 Arm64'
          - runner: macos-15-intel
            name: 'macOS 15 Intel'
    steps:
      - uses: actions/checkout@v6
      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'oracle'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Run unit tests
        run: mvn -B -pl test-framework-core -am clean test
      - name: Upload Surefire Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ matrix.os.runner }}-jdk${{ matrix.java }}
          path: 'test-framework-core/target/surefire-reports/*'
          if-no-files-found: ignore
